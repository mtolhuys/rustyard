[package]
name = "rustyard"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A Rust-first local web development workflow, powered by Lerd"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[workspace]
exclude = ["examples/hello"]
