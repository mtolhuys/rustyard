name: Rustyard checks
on: [push, pull_request]
jobs:
  check:
    # macOS is added once it has been validated on real hardware.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: ./scripts/check.sh
      # No system services required: the HTTP test runs a temporary Axum app.
      - run: cargo build --locked
      - run: python3 scripts/smoke.py --runner "$PWD/target/debug/rustyard"
